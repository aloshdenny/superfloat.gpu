yaml_version: 6

project:
  title:      "Atreides — Q1.15 Neural Network Accelerator GPU"
  author:     "Alosh Denny"
  discord:    ""
  description: |
    A minimal GPU implementation in SystemVerilog optimized for neural network inference
    using Q1.15 fixed-point arithmetic. Features 2 parallel compute cores with systolic
    arrays (4×4 FMA grids), a hardware memory arbiter for 8 data + 2 program memory
    channels multiplexed over the bidirectional I/O bus, a KV-Cache, and memory
    coalescing. Targets 50 MHz operation on Sky130 technology.
  language:   "SystemVerilog"
  clock_hz:   50000000

  # Source files — all SVs required by Yosys synthesis
  source_files:
    - tt_um_aloshdenny_gpu.sv
    - gpu.sv
    - dcr.sv
    - controller.sv
    - dispatch.sv
    - core.sv
    - decoder.sv
    - fetcher.sv
    - scheduler.sv
    - alu.sv
    - fma.sv
    - activation.sv
    - lsu.sv
    - registers.sv
    - pc.sv
    - systolic_array.sv
    - systolic_pe.sv
    - cache.sv
    - branch_diverge.sv
    - kv_cache.sv
    - mem_coalesce.sv
    - weight_mem.sv

  top_module: "tt_um_aloshdenny_gpu"

  # Tile size: 8 wide × 4 tall = 32 tiles (1378.16 µm × 511.36 µm)
  tiles: "8x4"

# I/O Pin Assignments — must exactly match tt_um_aloshdenny_gpu.sv
pinout:
  # Dedicated Inputs ui_in[7:0]
  ui[0]: "Thread count [bit 0] — device control register LSB"
  ui[1]: "Thread count [bit 1]"
  ui[2]: "Thread count [bit 2]"
  ui[3]: "Thread count [bit 3]"
  ui[4]: "Thread count [bit 4]"
  ui[5]: "Thread count [bit 5]"
  ui[6]: "Thread count [bit 6] — device control register MSB"
  ui[7]: "Start — pulse HIGH to launch kernel execution"

  # Dedicated Outputs uo_out[7:0]
  uo[0]: "GPU done — HIGH when kernel execution completes"
  uo[1]: "mem_we — external SRAM write enable"
  uo[2]: "mem_re — external SRAM read enable"
  uo[3]: "ale — address latch enable"
  uo[4]: "mem_sel — 0=Program memory, 1=Data memory"
  uo[5]: "Reserved (GND)"
  uo[6]: "Reserved (GND)"
  uo[7]: "Reserved (GND)"

  # Bidirectional uio[7:0] — time-multiplexed address/data bus
  uio[0]: "Address/Data bus bit 0 (time-multiplexed)"
  uio[1]: "Address/Data bus bit 1 (time-multiplexed)"
  uio[2]: "Address/Data bus bit 2 (time-multiplexed)"
  uio[3]: "Address/Data bus bit 3 (time-multiplexed)"
  uio[4]: "Address/Data bus bit 4 (time-multiplexed)"
  uio[5]: "Address/Data bus bit 5 (time-multiplexed)"
  uio[6]: "Address/Data bus bit 6 (time-multiplexed)"
  uio[7]: "Address/Data bus bit 7 (time-multiplexed)"
